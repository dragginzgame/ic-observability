[workspace]
members = ["crates/ic-logging", "crates/ic-metrics"]
default-members = ["crates/ic-logging", "crates/ic-metrics"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-observability"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]

[workspace.dependencies]
# Logging
# Changelog : releases/logging/CHANGELOG.md
ic-logging = { path = "crates/ic-logging", version = "0.23.5" }

# Metrics
# Changelog : releases/metrics/CHANGELOG.md
ic-metrics = { path = "crates/ic-metrics", version = "0.24.5" }

# Production dependencies
# External, also used by tests: Wire is optional/native-only; Serde is standard.
ic-wire = { version = "0.13.2", default-features = false, features = ["typescript"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }

# Tests and tooling only
# External arithmetic oracle and native-only JSON conformance.
num-bigint = { version = "0.5.1", default-features = false }
serde_json = "1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
