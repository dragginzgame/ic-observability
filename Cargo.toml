[workspace]
members = [
    # Production packages
    "crates/ic-logging",
    "crates/ic-metrics",
]
default-members = ["crates/ic-logging", "crates/ic-metrics"]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-observability"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]

[workspace.dependencies]
# logging
# Changelog : releases/logging/CHANGELOG.md
ic-logging = { path = "crates/ic-logging", version = "0.25.0" }

# metrics
# Changelog : releases/metrics/CHANGELOG.md
ic-metrics = { path = "crates/ic-metrics", version = "0.30.0" }

# Tests and tooling only
# External restoration oracle and public API trait-refusal checks.
num-bigint = { version = "0.5.1", default-features = false }
serde = { version = "1.0", default-features = false }
toko-tooling = "=0.40.0"

[workspace.lints.cargo]
# Product identities are required release catalog entries, not dependency edges.
unused_workspace_dependencies = "allow"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
# Retain the existing API/style checks; there are no broad local suppressions.
pedantic = { level = "warn", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
