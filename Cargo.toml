[workspace]
members = [
    # Production packages
    "crates/ic-logging",
    "crates/ic-metrics",
]
default-members = ["crates/ic-logging", "crates/ic-metrics"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-observability"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]

[workspace.dependencies]
# logging
# Changelog : releases/logging/CHANGELOG.md
ic-logging = { path = "crates/ic-logging", version = "0.24.13" }

# metrics
# Changelog : releases/metrics/CHANGELOG.md
ic-metrics = { path = "crates/ic-metrics", version = "0.29.9" }

# Tests and tooling only
# External restoration oracle and public API trait-refusal checks.
num-bigint = { version = "0.5.1", default-features = false }
serde = { version = "1.0", default-features = false }
toko-tooling = "=0.37.5"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
