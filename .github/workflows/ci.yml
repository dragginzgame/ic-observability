name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.select.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Classify exact tested changes
        id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.ref }}
          CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: bash scripts/ci/select-ci.sh

  typescript:
    needs: changes
    if: ${{ always() && !cancelled() }}
    env:
      CI_SCOPE: ${{ needs.changes.result == 'success' && needs.changes.outputs.scope == 'docs' && 'docs' || 'full' }}
      # Frozen registry acceptance intent; advance with the published catalog/lock.
      PUBLISHED_METRICS_VERSION: '0.24.4'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Record documentation-only scope
        if: env.CI_SCOPE == 'docs'
        run: echo 'Documentation-only selection; typescript qualification was not run.' >> "$GITHUB_STEP_SUMMARY"
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.CI_SCOPE != 'docs'
      - name: Prepare pinned Node
        if: env.CI_SCOPE != 'docs'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ci/node-version.txt
          package-manager-cache: false
      - name: Prepare host parsers and development Rust
        if: env.CI_SCOPE != 'docs'
        run: |
          bash scripts/dev/install-host-tools.sh --consumer "$PWD"
          PATH="$PWD/.tools/host/bin:$PATH" bash scripts/dev/prepare-rust-toolchain.sh \
            --toolchain-file rust-toolchain.toml
      - name: Prepare locked sources
        if: env.CI_SCOPE != 'docs'
        run: cargo fetch --locked
      - name: Prepare locked TypeScript compiler
        if: env.CI_SCOPE != 'docs'
        run: |
          bash scripts/dev/prepare-typescript.sh
          make typescript-setup-check
      - name: Prepare identity qualification sources
        if: env.CI_SCOPE != 'docs'
        run: |
          PATH="$PWD/.tools/host/bin:$PATH" bash scripts/dev/prepare-rust-toolchain.sh \
            --workspace-manifest Cargo.toml --target wasm32-unknown-unknown
          bash scripts/ci/check-wire-identities.sh --prepare
          bash scripts/ci/check-wire-identities.sh --published "$PUBLISHED_METRICS_VERSION" --prepare
      - name: Execute Rust and TypeScript report codecs
        if: env.CI_SCOPE != 'docs'
        run: |
          mkdir -p target/typescript-conformance
          make typescript-check wire-identities-check 2>&1 | tee target/typescript-conformance/check.log
          make published-identities-check EXPECTED_METRICS_VERSION="$PUBLISHED_METRICS_VERSION" \
            2>&1 | tee target/typescript-conformance/published-check.log
      # actions/upload-artifact v7
      - name: Retain conformance inputs and outputs
        if: env.CI_SCOPE != 'docs' && (always())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: typescript-conformance-${{ github.run_attempt }}
          path: |
            target/typescript-conformance/
            target/qualification/wire-identities.*/Cargo.toml
            target/qualification/wire-identities.*/Cargo.lock
            target/qualification/wire-identities.*/catalog.json
            target/qualification/wire-identities.*/metadata.json
            target/qualification/wire-identities.*/probe/
          if-no-files-found: ignore
          retention-days: 30

  native:
    needs: changes
    if: ${{ always() && !cancelled() }}
    env:
      CI_SCOPE: ${{ needs.changes.result == 'success' && needs.changes.outputs.scope == 'docs' && 'docs' || 'full' }}
    # Cold tool setup and the complete fixture suite share this job budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: Linux
            architecture: x86_64
          - runner: macos-15-intel
            os: Darwin
            architecture: x86_64
          - runner: macos-15
            os: Darwin
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.CI_SCOPE == 'docs' && matrix.runner == 'ubuntu-24.04'
      - name: Check documentation and snapshot
        id: docs
        if: env.CI_SCOPE == 'docs' && matrix.runner == 'ubuntu-24.04'
        run: |
          make shared-tooling-check check-doc-links
          git diff --check
      - name: Record documentation-only scope
        if: env.CI_SCOPE == 'docs'
        run: echo 'Documentation-only selection; native qualification was not run.' >> "$GITHUB_STEP_SUMMARY"
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.CI_SCOPE != 'docs'
        id: checkout
      - name: Record native qualification inputs
        if: env.CI_SCOPE != 'docs'
        id: native_inputs
        run: |
          bash scripts/ci/record-native-inputs.sh
      - name: Check consumer Make setup before tool installation
        if: env.CI_SCOPE != 'docs'
        id: setup_smoke
        run: |
          if [[ "${{ matrix.os }}" == Darwin ]]; then
            bash scripts/ci/check-setup-smoke.sh /usr/bin/make
          else
            bash scripts/ci/check-setup-smoke.sh
          fi 2>&1 | tee target/evidence/native-ci/setup-smoke.log
      - name: Verify native host
        if: env.CI_SCOPE != 'docs'
        id: native_host
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          if [[ "$EXPECTED_OS" == Darwin ]]; then
            bash scripts/ci/check-native-host.sh "$EXPECTED_OS" "$EXPECTED_ARCHITECTURE" 15
            echo /bin >> "$GITHUB_PATH"
          else
            bash scripts/ci/check-native-host.sh "$EXPECTED_OS" "$EXPECTED_ARCHITECTURE"
          fi
      - name: Install native tooling prerequisites
        if: env.CI_SCOPE != 'docs'
        id: prerequisites
        run: |
          case "$(uname -s)" in
            Linux)
              sudo apt-get update && sudo apt-get install -y xz-utils perl
              ;;
            Darwin) brew install xz ;;
            *) echo 'unsupported native host' >&2; exit 1 ;;
          esac 2>&1 | tee target/evidence/native-ci/prerequisites.log
      - name: Prepare host parsers
        if: env.CI_SCOPE != 'docs'
        id: host_tools
        run: |
          bash scripts/dev/install-host-tools.sh --consumer "$PWD" \
            2>&1 | tee target/evidence/native-ci/host-tools.log
      - name: Prepare development Rust
        if: env.CI_SCOPE != 'docs'
        id: toolchain
        run: |
          PATH="$PWD/.tools/host/bin:$PATH" bash scripts/dev/prepare-rust-toolchain.sh \
            --toolchain-file rust-toolchain.toml
      - name: Install and verify the complete common toolset
        if: env.CI_SCOPE != 'docs'
        id: tools
        uses: ./.github/actions/prepare-common-tools
      - name: Record installed tool versions
        if: env.CI_SCOPE != 'docs'
        id: tool_inputs
        run: |
          {
            rustc --version
            cargo --version
            bash scripts/ci/report-tool-versions.sh "$GITHUB_WORKSPACE"
          } > target/evidence/native-ci/tool-versions.txt 2>&1
      - name: Prepare the locked application sources
        if: env.CI_SCOPE != 'docs'
        id: application_sources
        run: |
          cargo fetch --locked 2>&1 | tee target/evidence/native-ci/application-sources.log
      - name: Run native CI
        if: env.CI_SCOPE != 'docs'
        id: native_ci
        env:
          TMPDIR: ${{ github.workspace }}/target/evidence/native-ci/scratch
        run: |
          mkdir -p "$TMPDIR"
          make ci 2>&1 | tee target/evidence/native-ci/native-ci.log
      - name: Retain native artifacts and outcome
        id: native_artifacts
        if: env.CI_SCOPE != 'docs' && (always() && steps.checkout.outcome == 'success')
        env:
          APPLICATION_OUTCOME: ${{ steps.application_sources.outcome }}
          NATIVE_OUTCOME: ${{ steps.native_ci.outcome }}
          SETUP_OUTCOME: ${{ steps.setup_smoke.outcome }}
          INPUT_OUTCOME: ${{ steps.native_inputs.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          HOST_OUTCOME: ${{ steps.native_host.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          PREREQUISITES_OUTCOME: ${{ steps.prerequisites.outcome }}
          HOST_TOOLS_OUTCOME: ${{ steps.host_tools.outcome }}
          TOOL_INPUT_OUTCOME: ${{ steps.tool_inputs.outcome }}
        run: |
          bash scripts/ci/collect-native-evidence.sh
      # actions/upload-artifact v7
      - name: Upload native diagnostics
        if: env.CI_SCOPE != 'docs' && (always() && steps.checkout.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-diagnostics-${{ matrix.runner }}-${{ github.run_attempt }}
          compression-level: 0
          path: |
            target/evidence/native-diagnostics.tar.gz
            target/evidence/native-diagnostics.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      # actions/upload-artifact v7
      - name: Upload native evidence
        if: env.CI_SCOPE != 'docs' && (always() && steps.checkout.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.runner }}-${{ github.run_attempt }}
          compression-level: 0
          path: |
            target/evidence/native-ci.tar.gz
            target/evidence/native-ci.tar.gz.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  msrv:
    needs: changes
    if: ${{ always() && !cancelled() }}
    env:
      CI_SCOPE: ${{ needs.changes.result == 'success' && needs.changes.outputs.scope == 'docs' && 'docs' || 'full' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Record documentation-only scope
        if: env.CI_SCOPE == 'docs'
        run: echo 'Documentation-only selection; msrv qualification was not run.' >> "$GITHUB_STEP_SUMMARY"
      # actions/checkout v6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.CI_SCOPE != 'docs'
        id: checkout
      - name: Record MSRV qualification inputs
        if: env.CI_SCOPE != 'docs'
        id: inputs
        run: bash scripts/ci/record-native-inputs.sh target/evidence/msrv-ci
      - name: Prepare host parsers
        if: env.CI_SCOPE != 'docs'
        id: host_tools
        run: |
          mkdir -p target/evidence/msrv-ci
          bash scripts/dev/install-host-tools.sh --consumer "$PWD" \
            2>&1 | tee target/evidence/msrv-ci/host-tools.log
      - name: Prepare minimum Rust
        if: env.CI_SCOPE != 'docs'
        id: toolchain
        run: |
          mkdir -p target/evidence/msrv-ci
          PATH="$PWD/.tools/host/bin:$PATH" bash scripts/dev/prepare-rust-toolchain.sh \
            --workspace-manifest Cargo.toml --target wasm32-unknown-unknown \
            2>&1 | tee target/evidence/msrv-ci/toolchain.log
      - name: Prepare the locked application sources
        if: env.CI_SCOPE != 'docs'
        id: application_sources
        run: |
          cargo fetch --locked 2>&1 | tee target/evidence/msrv-ci/application-sources.log
      - name: Check workspace native and Wasm MSRV
        if: env.CI_SCOPE != 'docs'
        id: check
        env:
          VALIDATION_LOG_DIR: ${{ github.workspace }}/target/evidence/msrv-ci
          VALIDATION_FAILURE_LOG_DIR: ${{ github.workspace }}/target/evidence/msrv-ci/failures
          ALLOCATION_FREE_EVIDENCE_ROOT: ${{ github.workspace }}/target/evidence/msrv-ci
          TMPDIR: ${{ github.workspace }}/target/evidence/msrv-ci/scratch
        run: |
          mkdir -p "$TMPDIR"
          bash scripts/ci/run-validation-targets.sh --fail-fast --input Cargo.toml --input Cargo.lock msrv
      - name: Retain MSRV artifacts and outcome
        id: artifacts
        if: env.CI_SCOPE != 'docs' && (always() && steps.checkout.outcome == 'success')
        env:
          INPUT_OUTCOME: ${{ steps.inputs.outcome }}
          HOST_TOOLS_OUTCOME: ${{ steps.host_tools.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          APPLICATION_SOURCES_OUTCOME: ${{ steps.application_sources.outcome }}
          MSRV_OUTCOME: ${{ steps.check.outcome }}
        run: bash scripts/ci/collect-msrv-evidence.sh
      # actions/upload-artifact v7
      - name: Upload MSRV evidence
        if: env.CI_SCOPE != 'docs' && (always() && steps.checkout.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: msrv-${{ github.run_attempt }}
          compression-level: 0
          path: |
            target/evidence/msrv-ci.tar.gz
            target/evidence/msrv-ci.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
